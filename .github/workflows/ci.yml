name: Correctness and evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.12'
      - name: Production correctness, independent oracles, sanitizers and compiled faults
        run: make test sanitize mutation
      - name: Current and archived measurements, licenses and publication checks
        run: python tools/check_release.py
      - name: Real model, fixed budgets, every tensor and held-out tail
        run: |
          python examples/digits/run.py test
          python examples/digits/run.py sanitize
      - name: Independent installed dataset and sklearn export reference
        run: |
          python -m pip install -r examples/digits/requirements.txt
          python examples/digits/prepare.py --check
      - name: Real model C timing smoke (not a performance gate)
        run: python examples/digits/run.py measure --output results/local/digits-ci --runs 1 --samples 2
      - name: Real C timing smoke (not a performance gate)
        run: |
          python tools/run_benchmark.py --output results/local/ci-smoke --runs 1 --samples 2 --repetitions 1024
          python tools/verify_report.py results/local/ci-smoke
